[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labelfuse"
dynamic = ["version"]
description = "Aggregate noisy labels from several annotators and audit the annotators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["annotation", "crowdsourcing", "label-aggregation", "dawid-skene", "noisy-labels"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
compare = ["crowd-kit>=1.2", "pandas>=1.5"]

[project.scripts]
labelfuse = "labelfuse.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/labelfuse"

[tool.hatch.version]
path = "src/labelfuse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/labelfuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["labelfuse"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = [
    "RUF002", # mathematical symbols in docstrings are intended
    "RUF003",
]
